{{- range .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    sandbox-session: {{ $.Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
        sandbox-session: {{ $.Release.Name }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          ports:
            - containerPort: {{ .port | default 8080 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    sandbox-session: {{ $.Release.Name }}
spec:
  selector:
    app: {{ .name }}
  ports:
    - port: {{ .port | default 8080 }}
      targetPort: {{ .port | default 8080 }}
{{- end }}
